<script>window.LINEAS = [{"at":0.05,"until":7.83,"texto":"A los tres años le tomaba prestadas a mi mamá las semillas de la cocina, nada más para ver qué salía."},{"at":7.9,"until":11.75,"texto":"Hoy cultivo hongos sobre bagazo de agave en un laboratorio."},{"at":11.82,"until":14.24,"texto":"Esto es La Creación del Robert."},{"at":15.06,"until":19.27,"texto":"Soy Robert. Desde muy chiquito me fascinó ver crecer las cosas."},{"at":19.34,"until":25.69,"texto":"Cultivar una planta me daba más alegría que cualquier videojuego, aunque tardara semanas en ver el resultado."},{"at":26.51,"until":31.79,"texto":"Ese gusto empezó como un vivero improvisado: vendía plantas y suculentas en los tianguis."},{"at":31.86,"until":38.57,"texto":"Y en tercero de primaria abrí un canal de YouTube para contarlo… que luego dejé dormir varios años."},{"at":39.39,"until":42.53,"texto":"Luego las plantas me llevaron a los números."},{"at":42.6,"until":51.17,"texto":"Gané oro dos veces en la ONMAPS de Jalisco, en 2017 y 2018, y competí en SASMO, SIMOC y VANDA."},{"at":51.24,"until":56.37,"texto":"Un bronce en SASMO me llevó a competir hasta Vietnam, en 2019."},{"at":57.19,"until":64.62,"texto":"Esas medallas me ganaron una beca completa en la prepa del Tec de Monterrey, que sigo teniendo en la universidad."},{"at":65.44,"until":68.93,"texto":"A los diez años me enamoré de los hongos."},{"at":69,"until":72.85,"texto":"Y como no tenía laboratorio, convertí mi recámara en uno."},{"at":73.67,"until":78.24,"texto":"Primero trabajaba junto a una llama, dentro de un contenedor de plástico."},{"at":78.31,"until":82.87,"texto":"Luego construí una caja de guantes, después mi propia campana de flujo."},{"at":82.94,"until":88.58,"texto":"Una olla de presión fue mi autoclave y los tuppers fueron mis cajas de Petri."},{"at":89.4,"until":97.18,"texto":"Laboratorio de bajo presupuesto, sí: cuando se me acabó el alcohol y me quedé sin llama, cambié a peróxido de hidrógeno."},{"at":98,"until":105.42,"texto":"Y no todo sale bien. Este frasco tenía miles de millones de esporas que no eran las que yo quería."},{"at":105.49,"until":110.77,"texto":"Aquí también subo lo que sale mal, porque un experimento no siempre es perfecto."},{"at":110.84,"until":115.05,"texto":"Hasta hice un tutorial de cómo crear un desastre biológico casero."},{"at":115.87,"until":121.15,"texto":"Con ese método saqué seta rosa de una impresión de esporas hasta la cosecha,"},{"at":121.22,"until":126.14,"texto":"cultivé hongos y bacterias que brillan en la oscuridad junto a mi cama,"},{"at":126.21,"until":131.14,"texto":"y logré que un reishi fructificara sobre un tronco lleno de mohos rivales."},{"at":131.96,"until":138.67,"texto":"También inventé cosas. A los quince, en plena pandemia, diseñé un filtro portátil de aire con luz ultravioleta."},{"at":138.74,"until":145.09,"texto":"A los dieciséis, el estado de Jalisco me nombró Joven Inventor y registré un modelo de utilidad."},{"at":145.91,"until":153.33,"texto":"Haciendo voluntariado en el Hospital Civil vi a personas que no tenían ni cinco pesos para entrar a un baño."},{"at":153.4,"until":156.89,"texto":"Así que construí un baño seco de bajo costo."},{"at":156.96,"until":166.67,"texto":"Ganó primer lugar nacional en PrepApps y primer lugar internacional en el Jacobs Teen Innovation Challenge, entre más de 4,700 estudiantes de 32 países."},{"at":167.49,"until":174.92,"texto":"Mi cocina-laboratorio se volvió un proyecto: De basura a comida, hongos comestibles sobre residuos agrícolas en menos de un mes."},{"at":174.99,"until":183.69,"texto":"Ganó platino en INFOMATRIX, oro en la Feria de Ciencias de Jalisco y me llevó a ser finalista de Rise en 2023."},{"at":184.51,"until":189.44,"texto":"En la universidad estudio Ingeniería en Biotecnología, me han dado la Excelencia Académica,"},{"at":189.51,"until":197.64,"texto":"tomé un curso de nanotecnología en el MIT.nano y hoy cuido el cepario del Carrillo Biorefinery Lab, en el Tec de Monterrey."},{"at":198.46,"until":204.82,"texto":"Con el fondo Ruta Azul convertí un espacio abandonado de mi prepa en una granja de setas,"},{"at":204.89,"until":213.02,"texto":"y les enseñé a cincuenta estudiantes a cultivarlas con ayuda de un tutor de inteligencia artificial que entrené. Así nació Fungi Mati."},{"at":213.84,"until":220.55,"texto":"Fungi Mati quedó entre los seis mejores de más de cien proyectos en el reto de Equitech Futures,"},{"at":220.62,"until":225.54,"texto":"y entré a beVisioneers, la beca de Mercedes-Benz, entre unas veinte mil personas."},{"at":226.36,"until":233.79,"texto":"Y lo que viene: una tonelada de bagazo de agave, lo que sobra del tequila, convertida en hongos para comer."},{"at":234.61,"until":237.39,"texto":"Entonces, ¿qué es La Creación del Robert?"},{"at":237.46,"until":242.38,"texto":"Es todo lo que hago, contado con rigor: cada dato con su fuente."},{"at":243.2,"until":252.05,"texto":"Aquí vas a encontrar Shots de Biotecnología, de hongos con Fungi Mati, del ambiente, de inteligencia artificial, de química y de ciencia en general."},{"at":252.12,"until":255.26,"texto":"Y cada semana, un video largo como este."},{"at":256.08,"until":263.86,"texto":"Gracias por quedarte. Que tengas un magnífico día, una magnífica semana, un magnífico mes, un magnífico año… y una magnífica vida."}];</script>
