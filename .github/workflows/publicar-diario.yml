name: Publicación diaria automática

# Publica cada día en las 6 redes el/los shot(s) que tocan según calendario/fecha.py (1 shot diario; festivos en su fecha).
# Permiso permanente de Robert (chat, 30 oct 2026). Hora: 2:43 pm de Ciudad de México (UTC−6), FIJA.
# Blindaje (31 oct 2026, Robert: "SIEMPRE tiene que publicarse sin mi intervención"):
#  - GitHub a veces retrasa o se salta tareas programadas: hay un intento cada hora de 3:13 a 11:13 pm. Si ya está todo
#    publicado no hacen nada (0 duplicados); si falta algo (o una red falló), lo publican / lo reintentan.
#  - Recuperación: si el shot normal de AYER no salió, se publica hoy también (los festivos no se recuperan: perderían su fecha).
#  - Aviso: si en el último intento (11:13 pm) algo sigue sin publicarse, el run falla y GitHub le manda un correo a Robert.
# Apagar: "activo": false en publicar/diario.json. Saltar un shot: su clave en publicar/pausa.txt.
on:
  schedule:
    - cron: '43 20 * * *'   # 2:43 pm CDMX: la hora oficial
    - cron: '13 21 * * *'   # 3:13 pm  ┐
    - cron: '13 22 * * *'   # 4:13 pm  │
    - cron: '13 23 * * *'   # 5:13 pm  │ respaldos: solo actúan si falta algo
    - cron: '13 0 * * *'    # 6:13 pm  │ (las horas UTC de después de medianoche siguen siendo
    - cron: '13 1 * * *'    # 7:13 pm  │  el mismo día en CDMX; la fecha se calcula en CDMX)
    - cron: '13 2 * * *'    # 8:13 pm  │
    - cron: '13 3 * * *'    # 9:13 pm  │
    - cron: '13 4 * * *'    # 10:13 pm │
    - cron: '13 5 * * *'    # 11:13 pm ┘ último intento: si algo falta, avisa por correo
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha AAAA-MM-DD (vacío = hoy en CDMX)'
        default: ''
      modo:
        description: 'real publica · prueba revisa todo sin subir nada'
        type: choice
        options: [real, prueba]
        default: real

permissions:
  actions: write
  contents: write   # anota en publicar/diario.log (además GitHub apaga las tareas programadas de repos sin cambios en 60 días)

concurrency:
  group: publicacion-diaria
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Publicar lo pendiente
        env:
          GH_TOKEN: ${{ github.token }}
          FECHA: ${{ inputs.fecha }}
          MODO: ${{ inputs.modo || 'real' }}
        run: |
          set -u
          CFG=publicar/diario.json
          if [ "$(jq -r .activo $CFG)" != "true" ]; then echo "Publicación diaria apagada en $CFG"; exit 0; fi
          HOY="${FECHA:-$(TZ=America/Mexico_City date +%F)}"
          AYER=$(date -d "$HOY -1 day" +%F)
          HORA=$(TZ=America/Mexico_City date +%H)
          ULTIMO=0; [ -z "$FECHA" ] && [ "$HORA" -ge 23 ] && ULTIMO=1
          REDES=$(jq -r '.redes | join(",")' $CFG); TT=$(jq -c .tiktok $CFG)
          python3 calendario/fecha.py json > cal.json
          git fetch -q origin refs/estado/publicaciones 2>/dev/null && git show FETCH_HEAD:publicaciones.json > bit.json 2>/dev/null || echo '[]' > bit.json
          pausado() { grep -v '^#' publicar/pausa.txt 2>/dev/null | grep -qxF "$1"; }
          completo() {  # ¿ya salió en todas las redes? (en TikTok, el borrador cuenta como hecho)
            for RED in $(jq -r '.redes[]' $CFG); do
              jq -e --arg k "$1" --arg r "$RED" '[.[] | select(.clave==$k and .red==$r and .modo=="real" and .ok==true)] | length > 0' bit.json >/dev/null || return 1
            done; }
          PEND=""
          for K in $(jq -r --arg f "$AYER" '.[$f][]?' cal.json); do   # recuperación de ayer (solo shots normales)
            case "$K" in fes-*) continue;; esac
            pausado "$K" || completo "$K" || PEND="$PEND $K"
          done
          for K in $(jq -r --arg f "$HOY" '.[$f][]?' cal.json); do
            pausado "$K" || { [ "$MODO" = "real" ] && completo "$K"; } || PEND="$PEND $K"
          done
          if [ -z "$PEND" ]; then echo "Nada pendiente el $HOY: todo publicado."; exit 0; fi
          echo "## Publicación del $HOY ($MODO): $PEND" >> "$GITHUB_STEP_SUMMARY"
          MAL=0
          for K in $PEND; do
            ANTES=$(gh run list -R "$GITHUB_REPOSITORY" -w publicar.yml -L 1 --json databaseId --jq '.[0].databaseId // 0')
            gh workflow run publicar.yml -R "$GITHUB_REPOSITORY" --ref main -f clave="$K" -f redes="$REDES" -f modo="$MODO" \
              -f confirmar="$K" -f autorizo="Robert: publicación diaria automática (permiso del 30 oct 2026)" \
              -f release=borradores-voces-v4 -f tiktok="$TT"
            RID=""; for i in $(seq 1 30); do sleep 10
              RID=$(gh run list -R "$GITHUB_REPOSITORY" -w publicar.yml -e workflow_dispatch -L 1 --json databaseId --jq '.[0].databaseId // 0')
              [ "$RID" != "$ANTES" ] && [ "$RID" != "0" ] && break; RID=""; done
            if [ -z "$RID" ]; then echo "- $K: no arrancó la publicación (se reintenta en 1 h)" >> "$GITHUB_STEP_SUMMARY"; MAL=1; continue; fi
            if gh run watch "$RID" -R "$GITHUB_REPOSITORY" --interval 30 --exit-status >/dev/null; then
              echo "- $K: listo ([detalle](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RID))" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $K: alguna red falló, se reintenta en 1 h ([detalle](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RID))" >> "$GITHUB_STEP_SUMMARY"; MAL=1
            fi
          done
          if [ "$MODO" = "real" ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "$HOY $(TZ=America/Mexico_City date +%H:%M) ·$PEND · $([ $MAL = 0 ] && echo ok || echo con-fallas)" >> publicar/diario.log
            git add publicar/diario.log && git commit -qm "Publicación diaria $HOY [sin render]" && \
              for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
          # Solo el último intento del día (o una corrida a mano) marca falla: así GitHub manda UN correo, no uno por hora.
          if [ $MAL = 1 ] && { [ $ULTIMO = 1 ] || [ -n "$FECHA" ]; }; then
            echo "::error::Algo no se publicó hoy ($PEND). Revisa el detalle; mañana se reintenta solo."; exit 1
          fi
          exit 0
