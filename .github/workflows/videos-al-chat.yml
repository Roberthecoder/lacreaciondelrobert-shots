name: Videos al chat

# Copia los MP4 y textos del Release "Borradores · <rama>" a la referencia refs/videos/<rama> (un solo commit que se reemplaza;
# no es una rama, así que git clone y git fetch normales no la bajan).
# Así las sesiones de Claude en la nube, que no pueden bajar archivos del Release (repo privado), los bajan con git
# y se los mandan a Robert dentro del chat. Corre solo al terminar cada "Render automático" (con la versión de main
# de este archivo, sin importar la rama) o a mano: Actions → Videos al chat → Run workflow → nombre de la rama.
on:
  workflow_run:
    workflows: ['Render automático']
    types: [completed]
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama de los videos (p. ej. remaster/lote-a)'
        required: true

permissions:
  contents: write

concurrency:
  group: videos-al-chat-${{ github.event.workflow_run.head_branch || inputs.rama }}
  cancel-in-progress: true

jobs:
  copiar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RAMA: ${{ github.event.workflow_run.head_branch || inputs.rama }}
    steps:
      - name: Bajar del Release y subir a refs/videos/<rama>
        run: |
          TAG="borradores-${RAMA//\//-}"
          RV="refs/videos/${RAMA//\//-}"
          mkdir -p v && cd v
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "*.mp4" -p "*_publicacion.md" --clobber || { echo "Sin Release $TAG"; exit 0; }
          find . -name "*.mp4" -size +95M -print -delete   # GitHub no acepta archivos de más de 100 MB
          ls -la
          echo "Videos de la rama $RAMA (copia del Release $TAG). Rama automática: no editar." > LEEME.md
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Videos de $RAMA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$RV"
          echo "Videos en $RV" | tee -a "$GITHUB_STEP_SUMMARY"
