name: Publicar en redes

# Sube el MP4 narrado final de un shot a las redes, con su texto de publicacion.md (motor/redes/publicar.py).
# Modos: prueba (revisa todo, no sube nada) · privado (borrador/privado, nadie lo ve) · real (publica).
# "real" SOLO con el permiso de Robert para esa publicación (ADMIN.md, "Publicar en redes").
#
# Dos formas de lanzarlo:
#  1. A mano: Actions → Publicar en redes → Run workflow.
#  2. Con git (para las sesiones de nube, que no pueden lanzar workflows): subir un archivo
#     publicar/pedidos/<id>.json con {"clave","redes","modo","confirmar","autorizo","tiktok"} a cualquier rama.
#     "tiktok" (opcional) = opciones que Robert eligió en la Sala: {"modo":"directo"|"borrador","privacidad",
#     "comentarios","duo","stitch","marca_propia","marca_pagada","ia","texto"}.
on:
  workflow_dispatch:
    inputs:
      clave:
        description: 'Clave del shot (carpeta en shots/, p. ej. 003-semillas-luna)'
        required: true
      redes:
        description: 'Redes separadas por coma: facebook,instagram,threads,youtube,linkedin,tiktok (o "todas")'
        default: 'todas'
      modo:
        description: 'prueba = no sube nada · privado = borrador/privado · real = publica (solo con permiso de Robert)'
        type: choice
        options: [prueba, privado, real]
        default: prueba
      confirmar:
        description: 'Solo modo real: vuelve a escribir la clave del shot'
        default: ''
      autorizo:
        description: 'Solo modo real: cuándo y dónde lo autorizó Robert (p. ej. "chat 29 oct")'
        default: ''
      release:
        description: 'Opcional: Release de donde tomar el MP4 (si no, busca <clave>_narrado.mp4, primero en borradores-main)'
        default: ''
      video:
        description: 'Opcional: nombre del MP4 en el Release (documentales: p. ej. doc-001-tema.mp4; si no, <clave>.mp4)'
        default: ''
      youtube:
        description: 'Documentales: opciones de YouTube en JSON, p. ej. {"privacidad":"unlisted","idioma":"en"}'
        default: ''
      tiktok:
        description: 'Opcional: opciones de TikTok en JSON, p. ej. {"privacidad":"SELF_ONLY"} o {"modo":"borrador"}'
        default: ''
      repetir:
        description: 'Publicar otra vez aunque ya se haya publicado en modo real'
        type: boolean
        default: false
  push:
    paths: ['publicar/pedidos/**.json']

permissions:
  contents: write   # bitácora refs/estado/publicaciones y tokens cifrados refs/estado/tokens

concurrency:
  group: redes        # mismo grupo que renovar-tokens y tiktok-conectar: nunca dos a la vez
  cancel-in-progress: false

jobs:
  pedidos:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      lista: ${{ steps.p.outputs.lista }}
    steps:
      - id: p
        env:
          EV: ${{ github.event_name }}
          IN: ${{ toJSON(github.event.inputs) }}
          GH_TOKEN: ${{ github.token }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
        run: |
          if [ "$EV" = "workflow_dispatch" ]; then
            echo "lista=$(jq -c '[{clave, redes, modo, confirmar, autorizo, release, tiktok, video, youtube, repetir: (.repetir|tostring)}]' <<<"$IN")" >> "$GITHUB_OUTPUT"
          else
            jq -r '[.commits[]? | ((.added // []) + (.modified // []))[]] | unique | .[] | select(startswith("publicar/pedidos/") and endswith(".json"))' \
              "$GITHUB_EVENT_PATH" > archivos.txt
            # Si GitHub no mandó la lista de archivos del push, se pide la comparación antes→después.
            if [ ! -s archivos.txt ] && [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then
              gh api "repos/$GITHUB_REPOSITORY/compare/$ANTES...$DESPUES" --jq '.files[] | select(.status != "removed") | .filename' \
                | grep -E '^publicar/pedidos/.*\.json$' > archivos.txt || true
            fi
            echo "lista=$(jq -c -n --rawfile a archivos.txt '$a | split("\n") | map(select(length>0) | {archivo: .})')" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: pedidos
    if: ${{ needs.pedidos.outputs.lista != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pedido: ${{ fromJSON(needs.pedidos.outputs.lista) }}
    env:
      GH_TOKEN: ${{ github.token }}
      META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_IG_ID: ${{ vars.META_IG_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      PEDIDO: ${{ toJSON(matrix.pedido) }}
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        # apt a veces se cuelga en GitHub (11 nov 2026: 1 h atorado y se perdió la publicación de las 9:20):
        # si ffmpeg ya viene en la máquina no se instala; si no, cada intento tiene límite de tiempo y se reintenta.
        timeout-minutes: 15
        run: |
          if ! command -v ffmpeg >/dev/null; then
            for i in 1 2 3; do
              timeout 180 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null && break
              echo "apt no respondió (intento $i); reintento"; sleep 10
            done
          fi
          ffmpeg -version | head -1
          pip install -q requests
      - name: Leer el pedido
        run: |
          if jq -e '.archivo' <<<"$PEDIDO" >/dev/null; then P=$(cat "$(jq -r .archivo <<<"$PEDIDO")"); else P="$PEDIDO"; fi
          for k in clave redes modo confirmar autorizo release repetir tiktok video youtube; do
            v=$(jq -r --arg k "$k" '.[$k] // "" | if type=="array" then join(",") else tostring end' <<<"$P")
            echo "P_${k^^}<<FIN_PEDIDO" >> "$GITHUB_ENV"; echo "$v" >> "$GITHUB_ENV"; echo "FIN_PEDIDO" >> "$GITHUB_ENV"
          done
      - name: Bajar el MP4 narrado
        run: |
          set -e
          [[ "$P_CLAVE" =~ ^[a-z0-9-]+$ ]] || { echo "::error::Clave inválida"; exit 1; }
          ARCH="${P_CLAVE}_narrado.mp4"
          # Documentales y videos largos 16:9 (largos/<clave>/): su MP4 se llama <clave>.mp4 o el que diga el pedido.
          if [ -n "$P_VIDEO" ]; then ARCH="$P_VIDEO"; elif [ -d "largos/$P_CLAVE" ] && [ ! -d "shots/$P_CLAVE" ]; then ARCH="${P_CLAVE}.mp4"; fi
          [[ "$ARCH" =~ ^[A-Za-z0-9._-]+\.mp4$ ]] || { echo "::error::Nombre de video inválido: $ARCH"; exit 1; }
          # 30 oct 2026: primero el narrado con la voz profesional nueva (Release borradores-voces-v4); si no, el más reciente.
          if [ -n "$P_RELEASE" ]; then TAG="$P_RELEASE"; else
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              | jq -rs --arg a "$ARCH" '[.[][] | select(any(.assets[]; .name==$a)) | {tag:.tag_name, f:([.assets[]|select(.name==$a)][0].updated_at)}]
                     | (map(select(.tag=="borradores-voces-v4")) + (sort_by(.f)|reverse)) | .[0].tag // ""')
          fi
          [ -n "$TAG" ] || { echo "::error::No hay $ARCH en ningún Release (¿falta la voz aprobada y el render narrado?)"; exit 1; }
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ARCH" -D video --clobber
          # Portada propia del documental, si el Release la tiene (si no, el publicador saca un cuadro del video).
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "${P_CLAVE}_portada.jpg" -D video --clobber 2>/dev/null || true
          echo "VIDEO=video/$ARCH" >> "$GITHUB_ENV"
          echo "VIDEO_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ARCH" >> "$GITHUB_ENV"
          echo "Video: $TAG / $ARCH"
      # Repo privado (1 nov 2026): Instagram y Threads bajan el video de una URL pública. Se sube una copia temporal al Release
      # «publicar-tmp» del repo público Roberthecoder/roberthecoder.github.io y se borra al terminar (paso «Borrar copia pública»).
      # Requiere el secreto PUBLICO_TOKEN (token fino con Contents: read & write solo sobre ese repo). Sin él, se usa el enlace de este repo.
      - name: Copia pública temporal del video
        env:
          PUBLICO_TOKEN: ${{ secrets.PUBLICO_TOKEN }}
        run: |
          [ -n "$PUBLICO_TOKEN" ] || { echo "Sin PUBLICO_TOKEN: se usa el enlace del Release de este repo"; exit 0; }
          PUB=Roberthecoder/roberthecoder.github.io
          NOMBRE="tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(basename "$VIDEO")"
          cp "$VIDEO" "/tmp/$NOMBRE"
          GH_TOKEN="$PUBLICO_TOKEN" gh release view publicar-tmp -R "$PUB" >/dev/null 2>&1 || \
            GH_TOKEN="$PUBLICO_TOKEN" gh release create publicar-tmp -R "$PUB" --title "Copias temporales para publicar" \
              --notes "Videos temporales que Instagram y Threads bajan al publicar; se borran solos al terminar cada publicación."
          GH_TOKEN="$PUBLICO_TOKEN" gh release upload publicar-tmp "/tmp/$NOMBRE" -R "$PUB" --clobber
          echo "VIDEO_URL=https://github.com/$PUB/releases/download/publicar-tmp/$NOMBRE" >> "$GITHUB_ENV"
          echo "VIDEO_TMP=$NOMBRE" >> "$GITHUB_ENV"
      - name: Publicar
        run: |
          EXTRA=()
          [ "$P_REPETIR" = "true" ] && EXTRA+=(--repetir)
          python3 motor/redes/publicar.py publicar --clave "$P_CLAVE" --redes "${P_REDES:-todas}" --modo "${P_MODO:-prueba}" \
            --video "$VIDEO" --video-url "$VIDEO_URL" --confirmar "$P_CONFIRMAR" --autorizo "$P_AUTORIZO" \
            --tiktok "$P_TIKTOK" --youtube "$P_YOUTUBE" "${EXTRA[@]}"
      - name: Borrar copia pública
        if: always() && env.VIDEO_TMP != ''
        env:
          PUBLICO_TOKEN: ${{ secrets.PUBLICO_TOKEN }}
        run: GH_TOKEN="$PUBLICO_TOKEN" gh release delete-asset publicar-tmp "$VIDEO_TMP" -R Roberthecoder/roberthecoder.github.io -y || true
