name: Revisar una publicación (solo lectura)
on:
  workflow_dispatch:
    inputs:
      clave:
        description: 'Clave del shot'
        required: true
permissions:
  contents: write   # TikTok puede rotar su token guardado
concurrency:
  group: redes
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_IG_ID: ${{ vars.META_IG_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python3 motor/redes/revisar.py "${{ inputs.clave }}"
