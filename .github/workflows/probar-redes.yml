name: Probar conexión con Threads y YouTube (solo lectura)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Threads
        env:
          T: ${{ secrets.THREADS_TOKEN }}
        run: |
          echo "== Threads: quién soy"
          curl -s "https://graph.threads.net/v1.0/me?fields=id,username&access_token=$T" | jq '{id,username,error:.error.message}'
      - name: YouTube
        env:
          CID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CS: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          RT: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "== YouTube: renovar acceso con el refresh token"
          curl -s https://oauth2.googleapis.com/token -d client_id="$CID" -d client_secret="$CS" -d refresh_token="$RT" -d grant_type=refresh_token \
            | jq '{ok:(.access_token!=null), scope, expira_en:.expires_in, error, error_description}'
      - name: LinkedIn
        env:
          T: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          echo "== LinkedIn: quién soy"
          curl -s -H "Authorization: Bearer $T" https://api.linkedin.com/v2/userinfo | jq '{sub,name,error:.message}'
